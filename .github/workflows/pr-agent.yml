# pr-agent (OSS) — inlined job for public-repo callers.
# Engine: OSS Qodo Merge on our OPENAI_KEY (trial-independent).
#
# WHY INLINED: wave-certify is PUBLIC; wave-av/wave-foundation is PRIVATE. GitHub Actions does
# NOT permit a public repo to consume a private repo's reusable workflow even with org-level
# access — the call fails in 0s with 0 jobs. Same constraint as foundation-gate.yml / _checks.yml.
# Keep in sync with wave-foundation/.github/workflows/reusable-pr-agent.yml when that SSOT changes.
name: pr-agent (OSS)
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

permissions:
  issues: write
  pull-requests: write
  contents: read

concurrency:
  group: pr-agent-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr_agent:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    steps:
      - name: PR Agent action step
        id: pragent
        uses: the-pr-agent/pr-agent@f6af7d77554ff8d26adffded077e6461329e92fa # v0.42.0
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          github_action_config.auto_review: "true"
          github_action_config.auto_improve: "true"
          github_action_config.auto_describe: "false"
          github_action_config.pr_actions: '["opened", "reopened", "ready_for_review", "synchronize"]'
          github_action_config.handle_push_trigger: "true"
          pr_code_suggestions.commitable_code_suggestions: "true"
